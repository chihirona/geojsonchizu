<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>東京都の学校マップ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
* { box-sizing: border-box; }
body { margin: 0; min-height: 100dvh; display: grid; grid-template-rows: auto 1fr; font: 15px system-ui, sans-serif; color: #153139; }
header { padding: 14px 20px; background: #f6fbfa; }
h1 { font-size: 22px; margin: 0 0 8px; }
.controls { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 14px; }
button, .pick { font: inherit; padding: 6px 12px; border: 1px solid #9cbab7; border-radius: 6px; background: white; color: inherit; cursor: pointer; }
button:disabled { opacity: .5; cursor: default; }
#status { margin: 8px 0 0; }
#map { min-height: 320px; background: #e0efee; }
</style>
</head>
<body>
<header>
<h1>東京都の学校マップ</h1>
<div class="controls">
<button id="extent" type="button" disabled>全地点を表示</button>
<button id="mainland" type="button">東京の市街地へ</button>
<button id="choose" type="button">GeoJSONを選択</button>
<input id="file" type="file" accept=".geojson,.json" hidden>
</div>
<p id="status" role="status">地図を読み込み中…</p>
</header>
<main id="map" aria-label="学校の位置を表示する地図"></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
const filename = 'P29-23_13.geojson';
const status = document.querySelector('#status');
const fileInput = document.querySelector('#file');
const extent = document.querySelector('#extent');
const mainland = document.querySelector('#mainland');
const choose = document.querySelector('#choose');
const types = {
  16001: '小学校', 16002: '中学校', 16003: '中等教育学校', 16004: '高等学校',
  16005: '高等専門学校', 16006: '短期大学', 16007: '大学', 16011: '幼稚園',
  16012: '特別支援学校', 16013: '幼保連携型認定こども園', 16014: '義務教育学校',
  16015: '各種学校', 16016: '専修学校'
};
if (typeof L === 'undefined') {
  status.textContent = '地図ライブラリを読み込めません。インターネット接続を確認して再読み込みしてください。';
  choose.disabled = mainland.disabled = true;
} else {
  const map = L.map('map', { preferCanvas: true });
  const showCity = () => map.setView([35.68, 139.55], 10);
  showCity();
  mainland.addEventListener('click', showCity);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(map);
  map.attributionControl.addAttribution('<a href="https://nlftp.mlit.go.jp/ksj/gml/datalist/KsjTmplt-P29-2023.html">国土数値情報（学校）</a>');

  let points;
  let loadVersion = 0;
  extent.addEventListener('click', () => map.fitBounds(points.getBounds(), { padding: [20, 20], maxZoom: 16 }));
  choose.addEventListener('click', () => fileInput.click());

  function popup(properties = {}) {
    const p = properties || {};
    const box = document.createElement('div');
    const title = document.createElement('strong');
    title.textContent = p.P29_004 || '名称未登録';
    box.append(title);
    for (const value of [p.P29_009, types[p.P29_003], p.P29_005]) {
      if (!value) continue;
      const line = document.createElement('div');
      line.textContent = value;
      box.append(line);
    }
    return box;
  }

  function plot(data) {
    if (data?.type !== 'FeatureCollection' || !Array.isArray(data.features)) {
      throw new Error('FeatureCollection形式のGeoJSONを選択してください。');
    }
    const features = data.features.filter(feature => {
      const geometry = feature?.geometry;
      if (geometry?.type !== 'Point' || !Array.isArray(geometry.coordinates)) return false;
      const [lng, lat] = geometry.coordinates;
      return Number.isFinite(lng) && Number.isFinite(lat) && Math.abs(lng) <= 180 && Math.abs(lat) <= 90;
    });
    if (!features.length) throw new Error('表示できる地点がありません。');
    const layer = L.geoJSON({ type: 'FeatureCollection', features }, {
      pointToLayer: (feature, latlng) => L.circleMarker(latlng, {
        radius: 5, color: '#fff', weight: 1, fillColor: '#007c75', fillOpacity: .85
      }),
      onEachFeature: (feature, marker) => marker.bindPopup(() => popup(feature.properties))
    });
    if (points) points.remove();
    points = layer.addTo(map);
    extent.disabled = false;
    status.textContent = `${features.length.toLocaleString('ja-JP')} 地点を読み込みました。点をクリックすると施設情報が表示されます。`;
    if (features.length < data.features.length) {
      status.textContent += ` 表示対象外: ${data.features.length - features.length} 件。`;
    }
  }

  fileInput.addEventListener('change', async () => {
    const file = fileInput.files[0];
    if (!file) return;
    fileInput.value = '';
    const version = ++loadVersion;
    try {
      const data = JSON.parse(await file.text());
      if (version !== loadVersion) return;
      plot(data);
      extent.click();
    } catch (error) {
      if (version === loadVersion) status.textContent = `GeoJSONを表示できませんでした。 ${error.message}`;
    }
  });

  async function loadNearbyFile() {
    if (location.protocol === 'file:') {
      status.textContent = `「GeoJSONを選択」から同じフォルダの ${filename} を選んでください。`;
      return;
    }
    const version = ++loadVersion;
    try {
      const response = await fetch('./' + filename);
      if (!response.ok) throw new Error('読み込みに失敗しました。');
      const data = await response.json();
      if (version === loadVersion) plot(data);
    } catch {
      if (version === loadVersion) {
        status.textContent = `同じフォルダの ${filename} を読み込めませんでした。「GeoJSONを選択」から開けます。`;
      }
    }
  }
  loadNearbyFile();
}
</script>
</body>
</html>
